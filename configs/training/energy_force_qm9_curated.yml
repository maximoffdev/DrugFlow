run_name: energy_force_qm9_curated_fcgraph_ve_ambigous
model_type: energy_force_diffusion

# Required by src/train.py even if unused by EnergyForceDiffusion
pocket_representation: CA+
virtual_nodes: null
flexible: False
flexible_bb: False

autoregressive: False

dpo_mode: null

train_params:
  logdir: ./runs
  datadir: /home/iwe67/qm_dataset
  enable_progress_bar: True
  num_sanity_val_steps: 0

  batch_size: 64
  accumulate_grad_batches: 2
  lr: 5.0e-4
  n_epochs: 50
  num_workers: 0
  gpus: 1
  clip_grad: True
  gradient_clip_val: 1.0

  # Debugging: log t/sigma/score statistics to WandB.
  log_diffusion_stats: True

  # QM9-curated PKL schema (OMol25-like keys)
  pkl_pos_key: pos
  pkl_atom_types_key: atomic_numbers
  pkl_energy_key: e_total
  pkl_forces_key: forces
  pkl_atom_types_format: atomic_numbers

  # QM9 elements (typically H/C/N/O/F)
  pkl_allowed_atomic_numbers: [1, 6, 7, 8, 9]

  # Flat-dir deterministic split
  pkl_val_fraction: 0.01
  pkl_val_n: null
  pkl_split_seed: 42

  # Optional: limit files for debugging, for full dataset use null
  pkl_file_limit: null

wandb_params:
  mode: offline  # disabled, offline, online
  entity:
  group: qm9_curated

loss_params:
  discrete_loss: CE  # CE or VLB
  lambda_x: 1.0
  lambda_h: 0.0
  lambda_energy: 0.0
  lambda_hjb: 0.0
  lambda_consistency: 0.0
  # Optional VE weighting (sigma(t)^2) in the coordinate DSM loss
  x_score_weight_by_sigma: True
  reduce: mean

simulation_params:
  n_steps: 1000

  # Enforce training/sampling in the zero center-of-mass subspace per molecule.
  # Recommended for ligand-only / point-cloud diffusion to remove translational drift.
  enforce_zero_com_noise: True

  # Also project the model-predicted score/force to the zero-CoM subspace.
  # Helps prevent center-of-mass drift during ODE/SDE sampling.
  project_predicted_force_zero_com: True

  # Train with diffusion on coordinates only (atom types are conditioned as clean one_hot).
  diffuse_h: False

  # Score diffusion noise schedule for coordinates (t=0 noise -> t=1 clean)
  sigma_min: 0.01
  sigma_max: 50.0

  coord_sde_kind: ve
  beta_min: 0.1
  beta_max: 20.0
  vp_sigma_scale: 1.0  # keep 1.0 unless your coords are not normalized

  # Training timestep range. Capping t_max away from 1.0 can prevent the very-clean
  # (very small sigma) region from dominating early training.
  t_min: 0.0
  t_max: 0.99

  # Temperature conditioning
  temperature: 1.0
  temperature_min: 0.99
  temperature_max: 1.01

eval_params:
  eval_batch_size: 64
  eval_epochs: 1
  n_loss_per_sample: 1

predictor_params:
  # Use the same GVP backbone used by DrugFlow (radius graph message passing).
  backbone: gvp

  # Conditioning
  condition_time: True
  condition_temperature: False

  # Radius-graph cutoff for ligand-only molecules.
  edge_cutoff_ligand: 50.0
  knn_k: 50

  # Scalar hidden size for node embeddings used by heads/decoders.
  hidden_nf: 128

  # GVP backbone parameters (match DrugFlow naming)
  reflection_equivariant: False
  d_max: 50.0
  num_rbf: 16
  gvp_params:
    n_layers: 5
    node_h_dim: [128, 32]
    edge_h_dim: [128, 32]
    dropout: 0.0
    vector_gate: True
